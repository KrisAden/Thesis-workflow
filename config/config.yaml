paths:
  base_network: "data/raw/elec_s_37.nc"
  gtoe_csv: "data/raw/gtoe_electricity.csv"
  rescaled_network: "data/interim/network_rescaled.nc"
  expanded_network: "data/interim/network_expansion.nc"
  network_with_storage: "data/interim/network_storage.nc"
  costed_network: "data/interim/network_costed.nc"
  costs_csv: "data/raw/generator_costs.csv"   
  storage_costs_csv: "data/raw/storage_costs.csv"  
  tables_dir: "results/tables"
  europe_borders: "data/raw/naturalearth_countries.geojson"

parameters:
  preprocess:
    bypass: false
  gtoe_to_twh: 11.63
  storage:
    add_battery: true
    add_hydrogen: true
  renewables:
    keep_existing: true
  expansion:
    lines:
      enable: true
      absolute_max: 1000000000
      min_equals_current: true
    links:
      enable: true
      absolute_max: 1000000000
      min_equals_current: true
    generators:
      relative_multiplier_by_carrier:
        geothermal: 100
        nuclear: 100
        biomass: 100
        solar: 1000000000000.0    # Effectively unlimited (1e12)
        onwind: 1000000000000.0   # Effectively unlimited (1e12)
        offwind-ac: 1000000000000.0  # Effectively unlimited (1e12)
        offwind-dc: 1000000000000.0  # Effectively unlimited (1e12)
      only_extendable: true
      min_equals_current: true
      floor: 1.0
  co2_reductions: [10]
  decentralization:
    k_values: [1, 2, 3, 4, 5, 6, 7]  # k values for 1/k <= gamma <= k constraint  
    renewable_carriers: ["solar", "onwind", "offwind-ac", "offwind-dc", "ror"]  # carriers considered renewable
    use_co2_equality: true  # Use CO2 = target instead of CO2 <= target (recommended for cost comparison)
    # Constraint modes:
    # - full: 1/k <= gamma <= k (forces both minimum and maximum renewable distribution)
    # - upper_only: gamma <= k (prevents over-concentration but allows under-deployment)
  solve:
    solver: "gurobi"
    solver_options:
      Threads: 4
      Method: 2
      Crossover: 0
      MarkowitzTol: 0.5
      BarConvTol: 1e-6
      BarCorrectors: -1
      BarHomogeneous: 1
      BarOrder: -1
      MemLimit: 120000
      Presolve: 2
      NumericFocus: 1
      AggFill: 1
      Aggregate: 2
      ScaleFlag: 2
      LogFile: "gurobi_solver.log"
  plotting:
    enable: false
    plot_types:
      renewable_generation_inequality: true
      renewable_penetration_gini_by_decarbonization: true
      green_investment_inequality: true
      green_investment_inequality_load_scaled: true
      renewable_capacity_concentration: true
      renewable_capacity_pentiles: true
      middle_pentile_characteristics: true
      capacity_expansion_evolution: true
      transmission_bottlenecks: true
      total_renewable_capacity: true
      electricity_cost: true
      electricity_cost_comparison: true
      generation_mix_actual: true
      renewable_penetration_boxplots: true
      interregional_transmission_expansion: true
      storage_expansion_boxplots: true
      total_system_cost: true
      mean_price_bellcurve: true
      mean_price_boxplots: true
      network_maps: true
      renewable_penetration_stacked_bars: true
    k_constrained_maps: true  
    output_formats: ["png"]
    dpi: 300


