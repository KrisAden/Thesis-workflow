paths:
  base_network: "data/raw/elec_s_37.nc"
  gtoe_csv: "data/raw/gtoe_electricity.csv"
  rescaled_network: "data/interim/network_rescaled.nc"
  expanded_network: "data/interim/network_expansion.nc"
  network_with_storage: "data/interim/network_storage.nc"
  costed_network: "data/interim/network_costed.nc"
  costs_csv: "data/raw/generator_costs.csv"   
  storage_costs_csv: "data/raw/storage_costs.csv"  
  tables_dir: "results/tables"

parameters:
  preprocess:
    bypass: false
  gtoe_to_twh: 11.63
  storage:
    add_battery: true
    add_hydrogen: true
  renewables:
    keep_existing: true
  expansion:
    lines:
      enable: true
      absolute_max: 200000
      min_equals_current: true
    links:
      enable: true
      absolute_max: 20000
      min_equals_current: true
    generators:
      relative_multiplier_by_carrier:
        geothermal: 10.0
        nuclear: 10.0
        biomass: 10.0
      only_extendable: true
      min_equals_current: true
      floor: 1.0
  co2_reductions: [0, 10, 20, 30, 40]
  solve:
    solver: "gurobi"
    solver_options:
      Threads: 4
      Method: 2
      Crossover: 0
      MarkowitzTol: 0.5
      BarConvTol: 1e-6
      BarCorrectors: -1
      BarHomogeneous: 1
      BarOrder: -1
      MemLimit: 120000
      Presolve: 2
      NumericFocus: 0
      AggFill: -1
      Aggregate: 2
      ScaleFlag: 2
      LogFile: "gurobi_solver.log"
  plotting:
    enable: true
    plot_types:
      renewable_capacity_inequality: true
      total_renewable_capacity: true
      electricity_cost: true
      network_topology: false
      generation_mix: false
      transmission_flows: false
      storage_utilization: false
      emissions_summary: false
      cost_breakdown: false
    output_formats: ["png", "pdf"]
    dpi: 300


